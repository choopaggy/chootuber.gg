<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>추튜버.GG</title>
<meta name="description" content="추튜버 살아남기 멤버 44명의 시청자 수 순위와 차트를 약 10분마다 모아 보여 주는 사이트">
<meta property="og:title" content="추튜버.GG">
<meta property="og:description" content="추튜버 살아남기 시청자 수 순위와 차트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a broadcast control room crossed with a Korean stock terminal.
   Ticker on top, one big market chart, a rank board beside it, a wall of monitors below.
   Korean market convention: rise is red, fall is blue. Deliberately single-theme. */
:root {
  color-scheme: dark;
  --bg: #0b1218;
  --panel: #111b23;
  --panel-2: #17242e;
  --line: #263742;
  --ink: #e9eff2;
  --ink-2: #a9bac4;
  --muted: #7d919d;
  --line-2: #4a606e;
  --bar: #6e8695;
  --accent: #f4b92e;
  --accent-ink: #1b1403;
  --up: #ff5a5f;
  --down: #4f9dff;
  --flat: #93a6b2;
  --danger: #ff9d42;
  --s1: #b88a14; --s2: #1fa896; --s3: #9a74e6; --s4: #57a22e;
  --s5: #d85f96; --s6: #3f9bd8; --s7: #d9743a; --s8: #8285db;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --data: "IBM Plex Mono", "IBM Plex Sans KR", ui-monospace, "Malgun Gothic", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin-inline: auto; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; padding-block: 10px; }
.logo { font: 400 26px/1 var(--display); letter-spacing: .01em; }
.logo b { font-weight: 400; color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav a { padding: 6px 12px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.clock { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 13px; }
.pause { padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; color: var(--ink-2); }
.pause:hover { color: var(--ink); border-color: var(--ink-2); }

.sample { background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; padding-block: 5px; }

/* Ticker */
.ticker { overflow: hidden; border-bottom: 1px solid var(--line); background: var(--panel); }
.ticker-run { display: flex; width: max-content; animation: run 48s linear infinite; }
.ticker:hover .ticker-run { animation-play-state: paused; }
.ticker-set { display: flex; }
.tk { display: flex; gap: 8px; align-items: baseline; padding: 7px 18px; border-right: 1px solid var(--line); white-space: nowrap; font-size: 13px; }
.tk:hover { background: var(--panel-2); }
.tk strong { font-weight: 600; }
@keyframes run { to { transform: translateX(-50%); } }

main { padding-block: 20px 40px; }
.view { display: grid; gap: 20px; }

/* Summary strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--panel); }
.strip > div { padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }
.strip > div:first-child { border-left: 0; }
.lbl { font-size: 12px; color: var(--muted); letter-spacing: .02em; font-weight: 500; }
.val { font: 400 28px/1.25 var(--display); overflow-wrap: anywhere; }
.val.num { font-family: var(--data); font-weight: 600; font-size: 26px; }
.sub { font-size: 13px; color: var(--ink-2); }

/* Panels */
.panel { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
h2 { font: 400 19px/1.3 var(--display); letter-spacing: .01em; }
.note { color: var(--muted); font-size: 13px; }

.deck { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 20px; align-items: start; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.tabs button { padding: 5px 12px; font-size: 13px; color: var(--ink-2); border-left: 1px solid var(--line); }
.tabs button:first-child { border-left: 0; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 10px 16px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; }
.chip i { width: 14px; height: 3px; border-radius: 2px; }
.chip[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.chart-box { position: relative; height: 440px; margin: 8px 8px 8px 16px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--bg); border: 1px solid var(--line); padding: 8px 10px; font-size: 12px; min-width: 150px; box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
.tip-t { color: var(--muted); margin-bottom: 4px; }
.tip-r { display: flex; align-items: center; gap: 6px; }
.tip-r i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.tip-r span:last-child { margin-left: auto; padding-left: 14px; }

/* Rank board */
.board { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--panel-2); }
.row .rk { font: 400 22px/1 var(--display); grid-row: span 2; color: var(--ink-2); }
.row.top3 .rk { color: var(--accent); }
.row .who { display: flex; align-items: center; gap: 7px; font-weight: 600; min-width: 0; }
.row .who i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.row .v { font-weight: 600; text-align: right; font-size: 16px; }
.row .meta { font-size: 12px; color: var(--muted); }
.row .d { font-size: 12px; text-align: right; }
.flash-up { animation: fu .7s; } .flash-down { animation: fd .7s; }
@keyframes fu { from { background: rgba(255, 90, 95, .22); } }
@keyframes fd { from { background: rgba(79, 157, 255, .22); } }
.cut { display: flex; align-items: center; gap: 8px; padding: 4px 16px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--panel-2); border-bottom: 1px dashed var(--accent); }

/* Monitor wall */
.wall { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.mon { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; min-width: 0; background: var(--bg) repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px); }
.mon:hover { background-color: var(--panel-2); }
.mon-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.lamp { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--up); }
.lamp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
.lamp.off { color: var(--muted); }
.lamp.off::before { animation: none; }
@keyframes pulse { 50% { opacity: .3; } }
.mon-name { font: 400 20px/1.2 var(--display); }
.mon-v { font-size: 20px; font-weight: 600; }
.mon svg { display: block; width: 100%; height: 44px; }

/* Bump chart and table */
.scroll { overflow-x: auto; }
.bump { display: block; width: 100%; min-width: 660px; height: auto; }
.bump g.ln { transition: opacity .12s; cursor: pointer; }
.bump:has(g.ln:hover) g.ln:not(:hover) { opacity: .16; }
.bump text { font-family: var(--body); fill: var(--ink-2); font-size: 12px; }
.bump text.nm { fill: var(--ink); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th.l, td.l { text-align: left; }
tbody tr:hover { background: var(--panel-2); }
.pill { display: inline-block; padding: 1px 7px; font-size: 12px; font-weight: 600; border-radius: 3px; border: 1px solid currentColor; }
.pill.safe { color: var(--ink-2); }
.pill.risk { color: var(--danger); }

/* Profile */
.back { color: var(--ink-2); font-size: 14px; }
.back:hover { color: var(--ink); }
.prof { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px; }
.ava { width: 72px; height: 72px; display: grid; place-items: center; font: 400 34px/1 var(--display); color: var(--bg); border-radius: 4px; flex: none; }
.prof h1 { font: 400 34px/1.15 var(--display); }
.prof-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; color: var(--ink-2); font-size: 14px; }
.prof-txt { flex: 1 1 220px; min-width: 0; }
.btn { display: inline-block; padding: 9px 16px; border-radius: 3px; font-weight: 600; background: var(--accent); color: var(--accent-ink); text-align: center; }
.btn:hover { filter: brightness(1.08); }
.btn.wait { background: none; color: var(--muted); border: 1px dashed var(--line); font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.stats > div { padding: 10px 16px; border-left: 1px solid var(--line); min-width: 0; }
.stats > div:first-child { border-left: 0; }
.stats .num { font-size: 19px; font-weight: 600; display: block; overflow-wrap: anywhere; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); padding: 10px 16px 0; }
.keys i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
.keys i.ma { height: 2px; width: 16px; vertical-align: 3px; background: var(--accent); }
.readout { padding: 6px 16px 0; font-size: 13px; color: var(--ink-2); min-height: 26px; }
.candle-box { height: 400px; margin: 4px 8px 8px 16px; }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.vod { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.vod:last-child { border-bottom: 0; }
.thumb { height: 52px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.vod-t { font-weight: 600; overflow-wrap: anywhere; }
.vod-m { font-size: 12px; color: var(--muted); }
.vod-l { font-size: 13px; color: var(--muted); text-align: right; }
.vod-l a { color: var(--accent); font-weight: 600; }

footer { border-top: 1px solid var(--line); padding-block: 14px 24px; color: var(--muted); font-size: 12px; }
footer a { text-decoration: underline; }

@media (max-width: 1040px) {
  .deck, .two { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats > div:nth-child(4) { border-left: 0; }
  .stats > div:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 640px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip > div:nth-child(3) { border-left: 0; }
  .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chart-box { height: 340px; margin-left: 8px; }
  .candle-box { height: 320px; margin-left: 8px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats > div:nth-child(odd) { border-left: 0; }
  .stats > div:nth-child(4) { border-left: 1px solid var(--line); }
  .stats > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .clock span { display: none; }
  .vod { grid-template-columns: minmax(0, 1fr) auto; }
  .thumb { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ticker { overflow-x: auto; }
  .ticker-run { animation: none; }
  .lamp::before { animation: none; }
  .flash-up, .flash-down { animation: none; }
}

/* Real-data additions */
.board { max-height: 560px; overflow-y: auto; }
.wall { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0; background: none; }
.mon { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.mon svg { height: 34px; }
.mon-name { font-size: 18px; }
.mon-v { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.pad { padding: 12px 16px; }
.empty { padding: 20px 16px; color: var(--ink-2); }
.big { font-size: 19px; font-weight: 600; display: block; }
.out { color: var(--accent); font-weight: 600; }
.find { display: flex; align-items: center; gap: 8px; }
.find input { width: 160px; max-width: 100%; padding: 6px 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; font: inherit; }
th button { color: inherit; font: inherit; padding: 0; white-space: nowrap; }
th button:hover, th button.on { color: var(--accent); }
.vod-list { max-height: 520px; overflow-y: auto; }
.lamp { white-space: nowrap; }
.mon, .row { -webkit-tap-highlight-color: transparent; }
@media (max-width: 640px) { .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); } .board { max-height: 460px; } }
/* 제목과 항목 이름은 본문 글꼴로, 보조 글자는 더 밝고 크게 표시합니다 */
h2 { font-family: var(--body); font-weight: 700; font-size: 18px; letter-spacing: 0; }
.lbl { font-size: 13px; color: var(--ink-2); letter-spacing: 0; }
.note, .sub, .row .meta, .row .d, .vod-m, .mon-top, .keys, .readout { font-size: 13px; color: var(--ink-2); }
.mon-v { font-size: 14px; color: var(--ink); }
.nav a { font-size: 16px; }
.tabs button { font-size: 14px; }
th { font-size: 13px; color: var(--ink-2); letter-spacing: 0; }
.vod-l { font-size: 14px; color: var(--ink-2); }
.cut { font-size: 13px; }
footer { font-size: 13px; color: var(--ink-2); }
.pf { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; background: var(--panel-2); }
.tk .pf { width: 20px; height: 20px; align-self: center; }
.mon-who, .tname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.thumb-live { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--panel-2); border-radius: 2px; }
.prof-live { display: grid; gap: 8px; padding: 0 16px 16px; max-width: 860px; }
.ava { position: relative; overflow: hidden; }
.ava img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.champ { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); background: var(--panel); border: 1px solid var(--accent); color: inherit; }
.champ:hover .champ-go { filter: brightness(1.08); }
.champ:hover .champ-img { transform: scale(1.015); }
.champ-pic { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--panel-2); display: grid; place-items: center; }
.champ-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
.champ-face { width: 34%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; }
.champ-tag { position: absolute; left: 12px; top: 12px; z-index: 2; padding: 3px 9px; border-radius: 3px; background: var(--up); color: #fff; font-size: 13px; font-weight: 700; }
.champ-tag.off { background: var(--panel); color: var(--ink-2); }
.champ-txt { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 20px 24px; min-width: 0; }
.champ-badge { align-self: flex-start; padding: 3px 10px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; }
.champ-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.champ-who .pf { width: 42px; height: 42px; box-shadow: 0 0 0 2px var(--accent) !important; }
.champ-name { font-size: 28px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.champ-num { font-family: var(--data); font-size: 34px; line-height: 1.15; font-weight: 600; font-variant-numeric: tabular-nums; }
.champ-title { color: var(--ink-2); font-size: 14px; overflow-wrap: anywhere; }
.champ-go { align-self: flex-start; padding: 10px 18px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .champ:hover .champ-img { transform: none; } }
@media (max-width: 820px) { .champ { grid-template-columns: minmax(0, 1fr); } .champ-txt { padding: 16px; } .champ-num { font-size: 28px; } }
.mon-title { font-size: 13px; line-height: 1.4; color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.mon[data-live] .thumb-live { cursor: pointer; }
.pop-hint { font-size: 13px; color: var(--accent); font-weight: 600; }
.pop { position: fixed; z-index: 20; left: 0; top: 0; width: min(640px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--accent); box-shadow: 0 14px 40px rgba(0, 0, 0, .6); opacity: 0; transform: scale(.94); transition: opacity .12s, transform .12s; }
.pop.on { opacity: 1; transform: scale(1); }
.pop-media { position: relative; aspect-ratio: 16 / 9; background: var(--panel-2); }
.live-modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(4, 8, 12, .78); }
.live-box { width: min(980px, 100%); max-height: 100%; overflow: auto; background: var(--bg); border: 1px solid var(--accent); }
.live-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
.live-head .num { color: var(--up); font-weight: 600; }
.live-profile { margin-left: auto; color: var(--accent); font-weight: 700; }
.pop .live-close { margin-left: auto; }
.pop-links { display: flex; gap: 12px; flex: none; }
.live-close { padding: 5px 12px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); }
.live-close:hover { border-color: var(--accent); color: var(--accent); }
.live-foot { display: grid; gap: 6px; padding: 12px 14px; }
.live-foot p { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.play-btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; padding: 12px 22px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.play-btn:hover { filter: brightness(1.08); }
.pop-media img, .pop-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.pop-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink-2); }
.pop-foot a { flex: none; color: var(--accent); font-weight: 700; }
.pop-txt { display: grid; gap: 4px; padding: 12px 14px; }
.pop-who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pop-who .num { margin-left: auto; color: var(--up); font-weight: 600; }
.pop-title { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .pop { transition: none; transform: none; } }
.bgm { display: flex; align-items: center; gap: 8px; }
.bgm-btn { padding: 4px 10px; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.bgm-btn:hover { color: var(--ink); border-color: var(--ink-2); }
.bgm-btn[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 600; }

.toast-open:hover { color: var(--accent); }
.toast-title { grid-column: 2; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast-close { grid-column: 3; grid-row: 1 / span 2; padding: 2px 6px; color: var(--ink-2); font-size: 16px; }
.toast-close:hover { color: var(--ink); }

/* 첫 화면용 실제 수집 기록. 이후 기록은 사이트 저장소에서 불러옵니다. */
const SEED = [
  { t: 1793627984, live: { cmzlsh940501: [6, "검사 약 스피드런"] } },
  { t: 1793628909, live: { cmzlsh940501: [9, "검사 약 스피드런"] } }
];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const KST = 9 * 3600, DAY = 86400;
const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map(css);
const dateLabel = t => { const d = new Date(t * 1000); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const timeLabel = t => { const d = new Date(t * 1000), p = n => String(n).padStart(2, "0"); return `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`; };
const toTime = n => { const s = String(n); return Date.UTC(2000 + +s.slice(0, 2), +s.slice(2, 4) - 1, +s.slice(4, 6)) / 1000; };

const MEMBERS = STATIONS.map(([name, id, nick, fan, secs, last]) => {
  const src = VODS[id] || { n: 0, v: [], t: [] };
  return {
    name, id, nick, fan, hours: secs / 3600, lastBroad: last ? Date.parse(last.replace(" ", "T") + "+09:00") / 1000 : 0,
    vodTotal: src.n, url: `https://www.sooplive.com/station/${id}`,
    vods: src.v.map(([date, mins, reads, no], i) => ({ time: toTime(date), mins, reads, no, title: src.t[i] || `${dateLabel(toTime(date))} 다시보기` }))
  };
});
let alertsReady = false, infoDate = "11/2", HIST = [], range = 1, boardKey = "cur", market, lines = new Map(), TOP = [];
const lastSnap = () => HIST[HIST.length - 1];
const profile = m => `#member-${encodeURIComponent(m.id)}`;
const color = m => m.color || css("--bar");
const pfUrl = m => `https://profile.img.sooplive.co.kr/LOGO/${m.id.slice(0, 2)}/${m.id}/${m.id}.jpg`;
const pf = m => `<img class="pf" src="${pfUrl(m)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true"${m.color ? ` style="box-shadow:0 0 0 2px ${m.color}"` : ""}>`;
const liveThumb = m => m.broadNo ? `<img class="thumb-live" src="https://liveimg.sooplive.com/m/${encodeURIComponent(m.broadNo)}?${m.thumbT}" alt="${esc(m.name)} 생방송 화면" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true">` : "";

function ingest(rows) {
  const before = lastSnap();
  HIST = rows.filter(r => r && typeof r.t === "number" && r.live).sort((a, b) => a.t - b.t);
  const latest = lastSnap();
  MEMBERS.forEach(m => {
    m.points = HIST.filter(s => s.live[m.id]).map(s => ({ t: s.t, v: +s.live[m.id][0] || 0 }));
    const now = latest && latest.live[m.id];
    m.cur = now ? +now[0] || 0 : null;
    m.title = now ? now[1] : "";
    m.broadNo = now ? now[2] || 0 : 0;
    m.thumbT = latest ? latest.t : 0;
    m.peak = m.points.reduce((x, p) => Math.max(x, p.v), 0);
    m.avg = m.points.length ? m.points.reduce((s, p) => s + p.v, 0) / m.points.length : 0;
    m.lastTime = Math.max(m.lastBroad, m.points.length ? m.points[m.points.length - 1].t : 0);
    m.color = null;
  });
  TOP = [...MEMBERS].filter(m => m.points.length).sort((a, b) => (b.cur ?? -1) - (a.cur ?? -1) || b.peak - a.peak).slice(0, 8);
  TOP.forEach((m, i) => m.color = COLORS[i]);
  paintAll();
  if (alertsReady && before && latest && latest.t > before.t) {
    const skip = new Set(before.failed || []);
    MEMBERS.filter(m => m.cur != null && !before.live[m.id] && !skip.has(m.id)).forEach(showToast);
  }
}
const lastText = m => {
  if (m.cur != null) return "방송 중";
  if (!m.lastTime) return "방송 기록 없음";
  const k = t => Math.floor((t + KST) / DAY), days = k(Date.now() / 1000) - k(m.lastTime);
  return days <= 0 ? "오늘 방송" : days < 365 ? `${days}일 전 방송` : `${Math.floor(days / 365)}년 전 방송`;
};
const rel = t => { const min = Math.max(0, Math.floor((Date.now() / 1000 - t) / 60)); return min < 1 ? "방금" : min < 60 ? `${min}분 전` : min < 1440 ? `${Math.floor(min / 60)}시간 전` : `${Math.floor(min / 1440)}일 전`; };

/* 방송 시작 알림 */
const toasts = document.createElement("div");
toasts.className = "toasts";
toasts.setAttribute("aria-live", "polite");
document.body.appendChild(toasts);
function showToast(m) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${pf(m).replace(' loading="lazy"', "")}<button type="button" class="toast-open">${esc(m.name)}님이 방송을 시작했습니다</button><span class="toast-title">${esc(m.title || "방송 중")}</span><button type="button" class="toast-close" aria-label="알림 닫기">×</button>`;
  el.querySelector(".toast-open").addEventListener("click", () => {
    el.remove();
    if (m.broadNo) openLive(m); else location.hash = `member-${encodeURIComponent(m.id)}`;
  });
  el.querySelector(".toast-close").addEventListener("click", () => el.remove());
  toasts.appendChild(el);
  while (toasts.children.length > 4) toasts.firstChild.remove();
  setTimeout(() => el.remove(), 30000);
}

/* 메인 차트 */
const chartBase = () => ({
  autoSize: true,
  layout: { background: { type: "solid", color: css("--panel") }, textColor: css("--ink-2"), fontFamily: "IBM Plex Sans KR, Malgun Gothic, sans-serif", fontSize: 12, attributionLogo: false },
  grid: { vertLines: { color: "rgba(38,55,66,.45)" }, horzLines: { color: "rgba(38,55,66,.8)" } },
  rightPriceScale: { borderColor: css("--line"), scaleMargins: { top: .12, bottom: .08 } },
  timeScale: { borderColor: css("--line"), rightOffset: 1, timeVisible: true, tickMarkFormatter: (t, type) => type < 3 ? dateLabel(t) : timeLabel(t) },
  crosshair: { mode: 0, vertLine: { color: css("--muted"), labelBackgroundColor: css("--panel-2") }, horzLine: { color: css("--muted"), labelBackgroundColor: css("--panel-2") } },
  localization: { locale: "ko-KR", priceFormatter: fmt, timeFormatter: t => `${dateLabel(t)} ${timeLabel(t)}` },
  handleScale: { axisPressedMouseMove: false }
});
function drawMarket() {
  lines.forEach(s => market.removeSeries(s));
  lines = new Map();
  document.querySelectorAll("[data-range]").forEach(b => b.setAttribute("aria-selected", +b.dataset.range === range));
  const end = lastSnap()?.t ?? 0, snaps = HIST.filter(s => !range || s.t >= end - range * DAY);
  $("range-note").textContent = `점 하나가 약 10분마다 수집한 값입니다. 방송을 쉰 구간은 점 없이 이어집니다. 기록 ${fmt(snaps.length)}회`;
  TOP.forEach(m => {
    const s = market.addLineSeries({ color: m.color, lineWidth: 2, pointMarkersVisible: true, pointMarkersRadius: 2, title: innerWidth > 640 ? m.name : "", priceLineVisible: false, crosshairMarkerRadius: 4, priceFormat: { type: "custom", formatter: fmt, minMove: 1 } });
    s.setData(snaps.map(x => x.live[m.id] ? { time: x.t + KST, value: +x.live[m.id][0] || 0 } : { time: x.t + KST }));
    lines.set(m.id, s);
  });
  $("legend").innerHTML = TOP.map(m => `<button type="button" class="chip" data-id="${esc(m.id)}" aria-pressed="true"><i style="background:${m.color}"></i>${esc(m.name)}</button>`).join("");
  market.timeScale().fitContent();
}
function buildMarket() {
  market = LightweightCharts.createChart($("market"), chartBase());
  market.subscribeCrosshairMove(p => {
    const tip = $("tip");
    if (!p.time || !p.point || p.point.x < 0) { tip.hidden = true; return; }
    const rows = TOP.map(m => ({ m, d: lines.get(m.id) && p.seriesData.get(lines.get(m.id)) })).filter(x => x.d && x.d.value != null).sort((a, b) => b.d.value - a.d.value);
    if (!rows.length) { tip.hidden = true; return; }
    tip.innerHTML = `<div class="tip-t num">${dateLabel(p.time)} ${timeLabel(p.time)}</div>` + rows.map((x, i) => `<div class="tip-r"><i style="background:${x.m.color}"></i><span>${i + 1}. ${esc(x.m.name)}</span><span class="num">${fmt(x.d.value)}</span></div>`).join("");
    tip.hidden = false;
    const box = $("market"), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = p.point.x + 16; if (x + w > box.clientWidth) x = p.point.x - w - 16;
    tip.style.left = Math.max(0, x) + "px";
    tip.style.top = Math.max(0, Math.min(p.point.y - h / 2, box.clientHeight - h)) + "px";
  });
  $("legend").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const show = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", show);
    lines.get(b.dataset.id)?.applyOptions({ visible: show });
  });
}

/* 순위와 모니터 */
function paintBoard() {
  document.querySelectorAll("[data-board]").forEach(b => b.setAttribute("aria-selected", b.dataset.board === boardKey));
  const val = { cur: m => m.cur ?? -1, peak: m => m.peak, fan: m => m.fan }[boardKey];
  const sorted = [...MEMBERS].sort((a, b) => val(b) - val(a) || b.peak - a.peak || b.fan - a.fan);
  const shown = boardKey === "cur" ? sorted.filter(m => m.cur != null) : boardKey === "peak" ? sorted.filter(m => m.peak) : sorted;
  $("board").innerHTML = shown.map((m, i) => `<a class="row${i < 3 ? " top3" : ""}" href="${profile(m)}">
    <span class="rk">${i + 1}</span>
    <span class="who">${pf(m)}<span>${esc(m.name)}</span></span>
    <span class="v num">${boardKey === "fan" ? fmt(m.fan) : `${fmt(boardKey === "cur" ? m.cur : m.peak)}명`}</span>
    <span class="meta">${esc(boardKey === "cur" ? m.title || "방송 중" : lastText(m))}</span><span class="d"></span></a>`).join("") ||
    `<p class="note pad">${boardKey === "cur" ? "마지막 수집 때 방송 중인 멤버가 없었습니다." : "아직 기록이 없습니다."}</p>`;
}
function paintWall() {
  const sorted = [...MEMBERS].sort((a, b) => (b.cur ?? -1) - (a.cur ?? -1) || b.lastTime - a.lastTime);
  const recent = HIST.slice(-24);
  $("wall").innerHTML = sorted.map(m => {
    const vals = recent.map(s => s.live[m.id] ? +s.live[m.id][0] || 0 : 0), hi = Math.max(1, ...vals), w = 200 / Math.max(vals.length, 24);
    const bars = vals.map((v, i) => { const h = v ? Math.max(3, v / hi * 32) : 1; return `<rect x="${(i * w).toFixed(1)}" y="${34 - h}" width="${(w * .78).toFixed(1)}" height="${h}" fill="${v ? color(m) : css("--line")}"></rect>`; }).join("");
    return `<a class="mon" href="${profile(m)}" data-id="${esc(m.id)}"${m.broadNo ? " data-live" : ""}><span class="mon-top"><span class="lamp${m.cur != null ? "" : " off"}">${m.cur != null ? "LIVE" : "OFF"}</span><span>${esc(lastText(m))}</span></span>
      <span class="mon-who">${pf(m)}<span class="mon-name">${esc(m.name)}</span></span><span class="mon-v num">${m.cur != null ? `${fmt(m.cur)}명 시청` : m.peak ? `최고 ${fmt(m.peak)}명` : "수집 기록 없음"}</span>${m.cur != null ? `<span class="mon-title">${esc(m.title || "방송 중")}</span>` : ""}
      ${liveThumb(m) || `<svg viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`}</a>`;
  }).join("");
}
function paintTicker() {
  const items = [...MEMBERS].sort((a, b) => (b.cur ?? -1) - (a.cur ?? -1) || b.peak - a.peak || b.fan - a.fan).slice(0, 12)
    .map(m => `<a class="tk" href="${profile(m)}" tabindex="-1">${pf(m)}<strong>${esc(m.name)}</strong><span class="num ${m.cur != null ? "up" : "flat"}">${m.cur != null ? `${fmt(m.cur)}명` : "OFF"}</span></a>`).join("");
  $("ticker").innerHTML = `<div class="ticker-run"><div class="ticker-set">${items}</div><div class="ticker-set">${items}</div></div>`;
}
function paintSummary() {
  const live = MEMBERS.filter(m => m.cur != null).sort((a, b) => b.cur - a.cur), s = lastSnap();
  $("s-total").textContent = fmt(live.reduce((x, m) => x + m.cur, 0));
  $("s-live").textContent = `${live.length} / ${MEMBERS.length}`;
  $("s-live-d").textContent = live.slice(0, 3).map(m => m.name).join(", ") + (live.length > 3 ? ` 외 ${live.length - 3}명` : "") || "방송 중인 멤버 없음";
  $("s-top").textContent = live[0]?.name ?? "-";
  $("s-top-d").textContent = live[0] ? `${fmt(live[0].cur)}명` : "방송 없음";
  $("s-at").textContent = s ? `${dateLabel(s.t + KST)} ${timeLabel(s.t + KST)}` : "-";
  $("s-count").textContent = s ? `${rel(s.t)}, 누적 ${fmt(HIST.length)}회 수집` : "수집 기록 없음";
  $("stamp").textContent = s ? `수집 ${dateLabel(s.t + KST)} ${timeLabel(s.t + KST)} KST` : "";
  const late = s && Date.now() / 1000 - s.t > 3600;
  $("notice").textContent = late ? `마지막 수집이 ${rel(s.t)}입니다. 수집이 지연되고 있습니다.` : "시청자 수는 SOOP에서 약 10분마다 수집합니다. 새 기록이 저장되면 화면이 자동으로 바뀝니다.";
}

/* 모니터 월 썸네일 확대와 생방송 재생 */
const pop = document.createElement("div");
pop.className = "pop";
pop.hidden = true;
document.body.appendChild(pop);
let popFor = null, playTimer = null, popPause = false, popMute = null;
const playUrl = id => `https://play.sooplive.com/${encodeURIComponent(id)}`;
function showPop(tile) {
  const m = MEMBERS.find(x => x.id === tile.dataset.id);
  if (!m || !m.broadNo) return hidePop();
  if (popFor !== m.id) {
    clearTimeout(playTimer);
    popFor = m.id;
    pop.innerHTML = `<div class="live-head">${pf(m).replace(' loading="lazy"', "")}<strong>${esc(m.name)}</strong><span class="num">${fmt(m.cur)}명 시청</span><button type="button" class="live-close" aria-label="미리보기 닫기">닫기</button></div><div class="pop-media" id="pop-media">${liveThumb(m).replace(' loading="lazy"', "").replace('class="thumb-live" ', "")}</div><div class="pop-txt"><div class="pop-title">${esc(m.title || "방송 중")}</div><div class="pop-foot"><span>광고가 먼저 나올 수 있습니다. 재생되지 않으면 재생기를 한 번 눌러 주세요.</span><span class="pop-links"><a href="${profile(m)}">프로필 보기</a><a href="${playUrl(m.id)}" target="_blank" rel="noopener">SOOP에서 보기</a></span></div></div>`;
    playTimer = setTimeout(() => {
      if (popFor === m.id) $("pop-media").insertAdjacentHTML("beforeend", playerFrame(m));
    }, 400);
  }
  pop.hidden = false;
  const pad = 12, x = Math.max(pad, (innerWidth - pop.offsetWidth) / 2), y = Math.max(pad, (innerHeight - pop.offsetHeight) / 2);
  pop.style.left = `${x}px`;
  pop.style.top = `${y}px`;
  pop.classList.add("on");
}
function hidePop() { if (popFor) popPause = true; clearTimeout(playTimer); popFor = null; pop.classList.remove("on"); pop.hidden = true; pop.innerHTML = ""; }
pop.addEventListener("click", e => { if (e.target.closest(".live-close")) hidePop(); });
// 미리보기는 닫기 버튼이나 Esc로만 닫습니다. 열려 있는 동안 마우스를 움직여도 바뀌지 않습니다.
// 닫은 직후 포인터 아래에 있던 썸네일은 포인터가 벗어나기 전까지 다시 열지 않습니다.
addEventListener("mousemove", e => {
  if (!e.target.closest || !matchMedia("(hover: hover)").matches) return;
  const t = e.target.closest("#wall .mon[data-live]"), id = t && e.target.closest(".thumb-live") ? t.dataset.id : null;
  if (popPause) { popPause = false; popMute = id; return; }
  if (popMute) { if (id === popMute) return; popMute = null; }
  if (id && !popFor) showPop(t);
});
$("wall").addEventListener("click", e => {
  const t = e.target.closest(".mon[data-live]");
  if (!t || !e.target.closest(".thumb-live")) return;  // 썸네일은 라이브 창, 나머지 영역은 프로필로 이동합니다
  e.preventDefault();
  const m = MEMBERS.find(x => x.id === t.dataset.id);
  if (m) openLive(m);
});
$("wall").addEventListener("focusin", e => { const t = e.target.closest(".mon[data-live]"); if (t && t.matches(":focus-visible")) showPop(t); });
addEventListener("keydown", e => { if (e.key === "Escape") hidePop(); });

/* 라이브 재생 창 */
const embedUrl = m => `${playUrl(m.id)}/${encodeURIComponent(m.broadNo)}/embed`;
const playerFrame = m => `<iframe data-no="${esc(m.broadNo)}" src="${embedUrl(m)}" title="${esc(m.name)} 생방송" allow="autoplay; fullscreen; local-network; loopback-network"></iframe>`;
const modal = document.createElement("div");
modal.className = "live-modal";
modal.hidden = true;
document.body.appendChild(modal);
function openLive(m) {
  hidePop();
  modal.innerHTML = `<div class="live-box" role="dialog" aria-modal="true" aria-label="${esc(m.name)} 생방송"><div class="live-head">${pf(m).replace(' loading="lazy"', "")}<strong>${esc(m.name)}</strong><span class="num">${fmt(m.cur)}명 시청</span><a class="live-profile" href="${profile(m)}">프로필 보기</a><button type="button" class="live-close" aria-label="닫기">닫기</button></div><div class="pop-media">${playerFrame(m)}</div><div class="live-foot"><p>${esc(m.title || "방송 중")}</p><div class="pop-foot"><span>광고가 먼저 나올 수 있습니다.</span><a href="${playUrl(m.id)}" target="_blank" rel="noopener">SOOP에서 보기</a></div></div></div>`;
  modal.hidden = false;
  modal.querySelector(".live-close").focus();
}
function closeLive() { if (!modal.hidden) popPause = true; modal.hidden = true; modal.innerHTML = ""; }
modal.addEventListener("click", e => { if (e.target === modal || e.target.closest(".live-close, .live-profile")) closeLive(); });
addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeLive(); });

/* 1위 특전 */
function paintChamp() {
  const live = MEMBERS.filter(m => m.cur != null).sort((a, b) => b.cur - a.cur || b.peak - a.peak)[0];
  const m = live || [...MEMBERS].filter(x => x.peak).sort((a, b) => b.peak - a.peak)[0];
  if (!m) { $("champ").innerHTML = ""; return; }
  const href = live ? `https://play.sooplive.com/${m.id}` : m.url;
  const img = live && m.broadNo ? `<img class="champ-img" src="https://liveimg.sooplive.com/m/${encodeURIComponent(m.broadNo)}?${m.thumbT}" alt="${esc(m.name)} 생방송 화면" referrerpolicy="no-referrer" onerror="this.hidden=true">` : "";
  $("champ").innerHTML = `<a class="champ" href="${esc(href)}" target="_blank" rel="noopener" aria-label="${esc(m.name)} ${live ? "생방송 보러 가기" : "방송국으로 이동"}">
    <div class="champ-pic"><img class="champ-face" src="${pfUrl(m)}" alt="" referrerpolicy="no-referrer" onerror="this.hidden=true">${img}<span class="champ-tag${live ? "" : " off"}">${live ? "LIVE" : "OFF"}</span></div>
    <div class="champ-txt"><span class="champ-badge">${live ? "현재 시청자 1위 특전" : "최고 기록 1위"}</span>
      <div class="champ-who">${pf(m)}<span class="champ-name">${esc(m.name)}</span></div>
      <div class="champ-num">${fmt(live ? m.cur : m.peak)}명</div>
      <div class="champ-title">${esc(live ? m.title || "방송 중" : "지금은 방송 중이 아닙니다")}</div>
      <span class="champ-go">${live ? "지금 보러 가기" : "방송국 가기"}</span></div></a>`;
}

/* 순위표 */
const COLS = [["rank", "순위", 1], ["name", "멤버", 1], ["cur", "현재 시청자"], ["peak", "최고 기록"], ["avg", "평균 시청자"], ["fan", "애청자"], ["hours", "누적 방송"], ["last", "최근 방송", 1], ["go", "방송국", 1]];
const SORT = { cur: m => m.cur ?? -1, peak: m => m.peak, avg: m => m.avg, fan: m => m.fan, hours: m => m.hours, last: m => m.lastTime };
let tableKey = "cur", query = "";
function paintTable() {
  $("rank-head").innerHTML = COLS.map(([k, l, left]) => `<th class="${left ? "l" : ""}">${SORT[k] ? `<button type="button" data-sort="${k}" class="${k === tableKey ? "on" : ""}">${l}${k === tableKey ? " ▼" : ""}</button>` : l}</th>`).join("");
  const q = query.trim();
  const list = [...MEMBERS].sort((a, b) => SORT[tableKey](b) - SORT[tableKey](a) || b.peak - a.peak || b.fan - a.fan).map((m, i) => [m, i + 1]).filter(([m]) => !q || m.name.includes(q) || m.nick.includes(q) || m.id.includes(q));
  $("rank-table").innerHTML = list.map(([m, r]) => `<tr><td class="l num">${r}</td><td class="l"><a class="tname" href="${profile(m)}">${pf(m)}<b>${esc(m.name)}</b></a></td>
    <td><span class="lamp${m.cur != null ? "" : " off"}">${m.cur != null ? `${fmt(m.cur)}명` : "OFF"}</span></td>
    <td class="num">${m.peak ? fmt(m.peak) : "-"}</td><td class="num">${m.avg ? fmt(m.avg) : "-"}</td><td class="num">${fmt(m.fan)}</td><td class="num">${fmt(m.hours)}시간</td><td class="l">${esc(lastText(m))}</td>
    <td class="l"><a class="out" href="${esc(m.url)}" target="_blank" rel="noopener">열기</a></td></tr>`).join("") || `<tr><td class="l" colspan="9">찾는 멤버가 없습니다.</td></tr>`;
}

/* 프로필 */
let candle, activeId = null;
function showMember(m) {
  activeId = m.id;
  const rank = [...MEMBERS].sort((a, b) => (b.cur ?? -1) - (a.cur ?? -1) || b.peak - a.peak).indexOf(m) + 1;
  const days = new Map();
  m.points.forEach(p => { const k = p.t + KST - (p.t + KST) % DAY, d = days.get(k); if (!d) days.set(k, { time: k, open: p.v, high: p.v, low: p.v, close: p.v }); else { d.high = Math.max(d.high, p.v); d.low = Math.min(d.low, p.v); d.close = p.v; } });
  const bars = [...days.values()].sort((a, b) => a.time - b.time);
  $("view-member").innerHTML = `
    <a class="back" href="#control">← 지통실로 돌아가기</a>
    <div class="panel">
      <div class="prof">
        <div class="ava" style="background:${color(m)}">${esc(m.name[0])}<img src="${pfUrl(m)}" alt="" referrerpolicy="no-referrer" onerror="this.hidden=true"></div>
        <div class="prof-txt"><h1>${esc(m.name)}</h1>
          <div class="prof-meta"><span>SOOP · ${esc(m.nick)}</span><span class="lamp${m.cur != null ? "" : " off"}">${m.cur != null ? `방송 중 · ${fmt(m.cur)}명 시청` : esc(lastText(m))}</span></div>
          ${m.title ? `<p class="note">방송 제목: ${esc(m.title)}</p>` : ""}</div>
        <a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener">방송국 바로가기</a>
      </div>
      ${m.broadNo ? `<div class="prof-live"><div class="pop-media">${playerFrame(m)}</div><div class="pop-foot"><span>광고가 먼저 나올 수 있습니다. 재생되지 않으면 재생기를 한 번 눌러 주세요.</span><a href="${playUrl(m.id)}" target="_blank" rel="noopener">SOOP에서 보기</a></div></div>` : ""}
      <div class="stats">
        <div><span class="lbl">현재 순위</span><span class="num">${m.cur != null ? `${rank}위` : "-"}</span></div>
        <div><span class="lbl">현재 시청자</span><span class="num">${m.cur != null ? fmt(m.cur) : "-"}</span></div>
        <div><span class="lbl">최고 기록</span><span class="num">${m.peak ? fmt(m.peak) : "-"}</span></div>
        <div><span class="lbl">평균 시청자</span><span class="num">${m.avg ? fmt(m.avg) : "-"}</span></div>
        <div><span class="lbl">애청자</span><span class="num">${fmt(m.fan)}</span></div>
        <div><span class="lbl">누적 방송</span><span class="num">${fmt(m.hours)}시간</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><h2>일자별 시청자 수</h2><p class="note">약 10분마다 수집한 값으로 만듭니다. 봉 하나가 그날의 시작, 최고, 최저, 종료 시청자 수입니다.</p></div></div>
      ${bars.length ? `<div class="keys"><span><i style="background:var(--up)"></i>상승 마감</span><span><i style="background:var(--down)"></i>하락 마감</span></div><div class="readout num" id="readout"></div><div class="candle-box" id="candle"></div>` : `<p class="empty">아직 수집된 방송이 없습니다. 방송을 시작하면 기록이 쌓입니다.</p>`}
    </div>
    <div class="panel"><div class="panel-head"><h2>방송 다시보기</h2><span class="note">${infoDate} 기준${m.vodTotal > m.vods.length ? `, 전체 ${fmt(m.vodTotal)}개 중 최근 ${m.vods.length}개` : ""}</span></div>
      ${m.vods.length ? m.vods.map(v => `<div class="vod"><div class="thumb num">${dateLabel(v.time)}</div><div><div class="vod-t">${esc(v.title)}</div><div class="vod-m">${Math.floor(v.mins / 60)}시간 ${v.mins % 60}분</div></div><div class="vod-l"><a href="https://vod.sooplive.com/player/${v.no}" target="_blank" rel="noopener">보기</a></div></div>`).join("") : `<p class="empty">올라온 다시보기가 없습니다.</p>`}
    </div>`;
  if (candle) { candle.remove(); candle = null; }
  if (!bars.length) return;
  const base = chartBase();
  base.timeScale.timeVisible = false;
  base.localization.timeFormatter = dateLabel;
  candle = LightweightCharts.createChart($("candle"), base);
  const up = css("--up"), down = css("--down");
  const s = candle.addCandlestickSeries({ upColor: up, downColor: down, borderUpColor: up, borderDownColor: down, wickUpColor: up, wickDownColor: down, priceLineVisible: false });
  s.setData(bars);
  const read = d => { $("readout").textContent = `${dateLabel(d.time)}  시작 ${fmt(d.open)}  최고 ${fmt(d.high)}  최저 ${fmt(d.low)}  종료 ${fmt(d.close)}`; };
  read(bars[bars.length - 1]);
  candle.subscribeCrosshairMove(p => read(bars.find(b => b.time === p.time) || bars[bars.length - 1]));
  candle.timeScale().fitContent();
}

/* 브금: 브라우저 정책상 방문자가 처음 클릭하거나 키를 누를 때 시작합니다 */
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 저장 없이 동작합니다 */ } }
};
const bgm = new Audio("bgm.mp3");
bgm.loop = true;
bgm.preload = "none";
bgm.volume = +store.get("bgm-volume", "35") / 100;
$("bgm-vol").value = Math.round(bgm.volume * 100);
let bgmWanted = store.get("bgm-on", "1") === "1";
const paintBgm = () => {
  const on = !bgm.paused;
  $("bgm-toggle").setAttribute("aria-pressed", on);
  $("bgm-toggle").textContent = on ? "♪ 브금 끄기" : "♪ 브금 켜기";
};
bgm.addEventListener("play", paintBgm);
bgm.addEventListener("pause", paintBgm);
$("bgm-toggle").addEventListener("click", e => {
  e.stopPropagation();
  stopFirst();
  bgmWanted = bgm.paused;
  store.set("bgm-on", bgmWanted ? "1" : "0");
  if (bgmWanted) bgm.play().catch(paintBgm); else bgm.pause();
});
$("bgm-vol").addEventListener("input", e => {
  bgm.volume = +e.target.value / 100;
  store.set("bgm-volume", e.target.value);
});
const firstPlay = e => {
  if (e.target.closest?.(".bgm")) return;
  stopFirst();
  if (bgmWanted) bgm.play().catch(paintBgm);
};
const stopFirst = () => { removeEventListener("pointerdown", firstPlay); removeEventListener("keydown", firstPlay); };
addEventListener("pointerdown", firstPlay);
addEventListener("keydown", firstPlay);

/* 화면 */
function paintAll() {
  paintTicker(); paintSummary(); paintBoard(); paintWall(); paintTable(); paintChamp();
  if (market) drawMarket();
  const m = activeId && MEMBERS.find(x => x.id === activeId);
  if (m && !$("view-member").hidden) {
    const f = $("view-member").querySelector(".prof-live iframe");
    if (f && f.dataset.no === String(m.broadNo)) {  // 새 기록이 와도 재생 중인 영상은 다시 불러오지 않습니다
      const lamp = $("view-member").querySelector(".prof-meta .lamp");
      if (lamp) lamp.textContent = `방송 중 · ${fmt(m.cur)}명 시청`;
    } else showMember(m);
  }
}
function route() {
  hidePop();
  closeLive();
  const h = decodeURIComponent(location.hash.slice(1)) || "control";
  const m = h.startsWith("member-") ? MEMBERS.find(x => x.id === h.slice(7)) : null;
  const view = m ? "member" : h === "ranking" ? "ranking" : "control";
  ["control", "ranking", "member"].forEach(v => $(`view-${v}`).hidden = v !== view);
  $("nav-control").removeAttribute("aria-current"); $("nav-ranking").removeAttribute("aria-current");
  if (view !== "member") $(`nav-${view}`).setAttribute("aria-current", "page");
  activeId = null;
  if (m) showMember(m); else $("view-member").innerHTML = "";  // 숨겨진 재생기가 소리를 계속 내지 않도록 비웁니다
  if (view === "control") { requestAnimationFrame(() => market.timeScale().fitContent()); setTimeout(() => market.timeScale().fitContent(), 120); }
  document.title = m ? `${m.name} · 추튜버.GG` : "추튜버.GG";
  scrollTo(0, 0);
}
buildMarket();
ingest(SEED);
route();
addEventListener("hashchange", route);
document.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => { range = +b.dataset.range; drawMarket(); }));
document.querySelectorAll("[data-board]").forEach(b => b.addEventListener("click", () => { boardKey = b.dataset.board; paintBoard(); }));
$("rank-head").addEventListener("click", e => { const b = e.target.closest("[data-sort]"); if (b) { tableKey = b.dataset.sort; paintTable(); } });
$("find").addEventListener("input", e => { query = e.target.value; paintTable(); });
setInterval(paintSummary, 60000);

async function refresh() {
  try {
    const r = await fetch(`snapshots.json?v=${Math.floor(Date.now() / 60000)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    const rows = await r.json();
    if (rows.length && rows[rows.length - 1].t !== lastSnap()?.t) ingest(rows);
    alertsReady = true;
  } catch { $("notice").textContent = "최신 기록을 불러오지 못했습니다. 잠시 후 다시 열어 주세요."; }
}
async function refreshStations() {
  try {
    const r = await fetch(`stations.json?v=${Math.floor(Date.now() / 3600000)}`, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    MEMBERS.forEach(m => {
      const x = d.stations?.[m.id];
      if (!x) return;
      Object.assign(m, { nick: x.nick || m.nick, fan: x.fan ?? m.fan, hours: (x.secs ?? m.hours * 3600) / 3600, vodTotal: x.vodTotal ?? m.vodTotal });
      if (x.last) m.lastBroad = Date.parse(x.last.replace(" ", "T") + "+09:00") / 1000;
      if (x.vods) m.vods = x.vods.map(([date, mins, no, title]) => ({ time: toTime(date), mins, no, title: title || `${dateLabel(toTime(date))} 다시보기` }));
    });
    if (d.at) infoDate = dateLabel(Date.parse(d.at.replace(" ", "T") + "Z") / 1000);
    ingest(HIST);
  } catch { /* 내장 정보로 계속 표시합니다 */ }
}
refreshStations();
refresh();
setInterval(refresh, 60000);
</script>
