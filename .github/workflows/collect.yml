name: 시청자 수 수집
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/collect.yml", "scripts/collect.mjs"]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect.mjs
      - name: 기록 저장
        run: |
          git config user.name "chootuber-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots.json stations.json 2>/dev/null || git add snapshots.json
          git diff --cached --quiet && exit 0
          git commit -m "시청자 수 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
          git pull --rebase origin main
          git push origin main
