name: 시청자 수 수집
on:
  schedule:
    - cron: "7 * * * *"   # 수집이 멈췄을 때 다시 시작하는 안전장치
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/collect.yml", "scripts/collect.mjs"]
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 10분마다 수집 (1시간 동안)
        run: |
          git config user.name "chootuber-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in 1 2 3 4 5 6; do
            started=$SECONDS
            git pull -q --rebase origin main || echo "pull 실패"
            if node scripts/collect.mjs; then
              git add snapshots.json
              [ -f stations.json ] && git add stations.json
              if ! git diff --cached --quiet; then
                git commit -q -m "시청자 수 수집 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
                git pull -q --rebase origin main && git push -q origin main || echo "push 실패"
              fi
            fi
            [ "$round" -lt 6 ] && sleep $(( 600 - (SECONDS - started) > 1 ? 600 - (SECONDS - started) : 1 ))
          done
      - name: 다음 수집 시작
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref main
